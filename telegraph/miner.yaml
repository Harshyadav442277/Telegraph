version: '1'
kind: miner
id: 20260828
slug: preflight-ssl-verification
protocol: generic
name: PREFLIGHT SSL Verification
description: >
  Deterministic live TLS verification for autonomous infrastructure and agents.
  Performs DNS resolution, a TLS 1.2/1.3 handshake with SNI, native chain
  verification, hostname verification, and certificate time validation.
base_url: https://preflight-ssl-verification.vercel.app

docs:
  repository: https://github.com/Harshyadav442277/Telegraph
  documentation: https://github.com/Harshyadav442277/Telegraph/blob/main/docs/TELEGRAPH-INTEGRATION.md

auth:
  type: none

rate_limit_per_sec: 5
cache_ttl_sec: 0
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /ssl-check
    external_path: /ssl-check
    method: GET
    description: Live TLS certificate verification for a hostname, HTTPS URL, or host:port.

input_schema:
  type: object
  required: [domain]
  properties:
    domain:
      type: string
      description: Hostname, HTTPS URL, or host:port to verify.

output_schema:
  type: object
  properties:
    chain_length: { type: [integer, 'null'] }
    domain: { type: string }
    verdict:
      type: string
      enum: [valid, expired, not_yet_valid, hostname_mismatch, self_signed, untrusted, unreachable]
    valid: { type: boolean }
    chain_complete: { type: [boolean, 'null'] }
    trusted: { type: boolean }
    expired: { type: boolean }
    hostname_match: { type: boolean }
    issuer: { type: [string, 'null'] }
    subject: { type: [string, 'null'] }
    subject_alt_names: { type: [array, 'null'] }
    valid_from: { type: [string, 'null'] }
    valid_to: { type: [string, 'null'] }
    days_remaining: { type: [integer, 'null'] }
    tls_protocol: { type: [string, 'null'] }
    cipher: { type: [string, 'null'] }
    key_bits: { type: [integer, 'null'] }
    confidence: { type: number, minimum: 0, maximum: 1 }
    reason: { type: string }
    unreachable_reason: { type: string }
    checked_at: { type: string }

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: verdict
    reason_field: reason
  supported_intents:
    - SSL_VERIFICATION
